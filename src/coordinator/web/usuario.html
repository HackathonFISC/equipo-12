<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AguaJusta Oeste — Reportar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --mist: #e7eef0;
      --sheet: #fffcf7;
      --ink: #142028;
      --muted: #3d5160;
      --line: #d5ddd8;
      --water: #0c5c62;
      --water-deep: #083e44;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--mist);
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-size: 1.05rem;
      line-height: 1.5;
    }
    header {
      padding: 1.15rem 1.5rem;
      background: var(--water-deep);
      color: #f4f7f6;
    }
    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 1.85rem;
      font-weight: 560;
    }
    .lede { margin: 0.2rem 0 0; color: #d5e4e2; }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.2fr);
      gap: 1rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }
    section {
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1rem 1.1rem 1.15rem;
    }
    h2 {
      margin: 0 0 0.35rem;
      font-family: Fraunces, Georgia, serif;
      font-size: 1.4rem;
      font-weight: 560;
    }
    .hint { margin: 0 0 0.75rem; color: var(--muted); }
    label { display: block; margin: 0.4rem 0 0.25rem; font-weight: 700; }
    textarea {
      width: 100%;
      min-height: 7rem;
      border: 1px solid #c9d4cf;
      border-radius: 12px;
      padding: 0.7rem 0.8rem;
      font: inherit;
      color: var(--ink);
      background: #fff;
      resize: vertical;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.7rem; }
    button {
      font: inherit;
      font-weight: 700;
      border: 1px solid var(--water);
      border-radius: 999px;
      padding: 0.55rem 1rem;
      cursor: pointer;
      background: #fff;
      color: var(--water-deep);
    }
    #btn-enviar, #btn-capturar { background: var(--water); color: #fff; border-color: var(--water); }
    button.is-on { background: var(--water-deep); color: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #sector-map { height: 480px; border-radius: 14px; background: #d7e4e2; }
    #camera-preview, #photo-preview {
      width: 100%;
      max-height: 240px;
      margin-top: 0.6rem;
      border-radius: 12px;
      background: #142028;
      object-fit: cover;
    }
    #send-status { margin: 0.8rem 0 0; font-weight: 700; color: var(--water-deep); }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      #sector-map { height: 360px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>AguaJusta Oeste</h1>
    <p class="lede">Cuéntenos dónde falta el agua en Arraiján o La Chorrera</p>
  </header>
  <main>
    <section>
      <h2>Su reporte</h2>
      <p class="hint">Escriba lo que pasa, tome una foto o grabe una nota. No hace falta importar un archivo.</p>
      <label for="reports-input">Texto</label>
      <textarea id="reports-input" placeholder="Ejemplo: 48 horas sin agua y 15 personas en el chino de Vista Alegre"></textarea>
      <div class="row">
        <button type="button" id="btn-camara">Abrir cámara</button>
        <button type="button" id="btn-camara-trasera" class="is-on">Trasera</button>
        <button type="button" id="btn-camara-frontal">Frontal</button>
      </div>
      <div class="row">
        <button type="button" id="btn-capturar" hidden>Tomar foto</button>
        <button type="button" id="btn-cerrar-camara" hidden>Cerrar cámara</button>
        <button type="button" id="btn-microfono">Grabar nota</button>
      </div>
      <video id="camera-preview" hidden playsinline autoplay></video>
      <canvas id="camera-canvas" hidden></canvas>
      <img id="photo-preview" alt="Foto capturada" hidden>
      <p id="photo-status" class="hint"></p>
      <p id="audio-status" class="hint"></p>
      <div class="row">
        <button type="button" id="btn-enviar">Enviar reporte</button>
      </div>
      <p id="send-status"></p>
    </section>
    <section>
      <h2>Mapa</h2>
      <p class="hint">Arraiján y La Chorrera. Las posiciones son anclas de demostración, no un levantamiento ni la red del IDAAN.</p>
      <div id="sector-map"></div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      var map = null;
      var layer = null;
      var cameraStream = null;
      var cameraFacing = "environment";
      var photoPayload = null;
      var audioPayload = null;
      var recorder = null;
      var recordChunks = [];
      var NAMES = {
        "Barrio Colon": "Barrio Colón",
        "Arraijan Cabecera": "Arraiján Cabecera",
        "Arraijan": "Arraiján"
      };

      function postJson(url, payload) {
        return fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload || {})
        }).then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok) throw new Error(data.error || "Error HTTP " + res.status);
            return data;
          });
        });
      }

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function niceName(name) {
        return NAMES[name] || name;
      }

      function blobToBase64(blob) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            var result = String(reader.result || "");
            var comma = result.indexOf(",");
            resolve(comma >= 0 ? result.slice(comma + 1) : result);
          };
          reader.onerror = function () { reject(new Error("No se pudo leer la captura.")); };
          reader.readAsDataURL(blob);
        });
      }

      function drawMap(sectors) {
        var el = document.getElementById("sector-map");
        var points = (sectors || []).filter(function (s) {
          return typeof s.latitude === "number" && typeof s.longitude === "number";
        });
        if (!window.L || !points.length) {
          el.innerHTML = "<p class=\"hint\">El mapa necesita conexión para cargar el callejero.</p>";
          return;
        }
        if (!map) {
          map = L.map(el, { scrollWheelZoom: false }).setView([8.91, -79.78], 12);
          L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap",
            maxZoom: 19
          }).addTo(map);
          layer = L.layerGroup().addTo(map);
        }
        layer.clearLayers();
        var bounds = [];
        points.forEach(function (s) {
          L.marker([s.latitude, s.longitude]).bindTooltip(niceName(s.name), {
            permanent: true,
            direction: "top"
          }).addTo(layer);
          bounds.push([s.latitude, s.longitude]);
        });
        if (bounds.length) {
          setTimeout(function () {
            map.invalidateSize();
            map.fitBounds(bounds, { padding: [36, 36], maxZoom: 13 });
          }, 80);
        }
      }

      function stopCamera() {
        if (cameraStream) {
          cameraStream.getTracks().forEach(function (track) { track.stop(); });
          cameraStream = null;
        }
        var video = document.getElementById("camera-preview");
        video.pause();
        video.srcObject = null;
        video.hidden = true;
        document.getElementById("btn-capturar").hidden = true;
        document.getElementById("btn-cerrar-camara").hidden = true;
        document.getElementById("btn-camara").hidden = false;
      }

      function openCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("Este navegador no permite usar la cámara.");
          return;
        }
        stopCamera();
        navigator.mediaDevices.getUserMedia({ video: { facingMode: cameraFacing }, audio: false })
          .then(function (stream) {
            cameraStream = stream;
            var video = document.getElementById("camera-preview");
            video.hidden = false;
            video.srcObject = stream;
            video.play();
            document.getElementById("btn-capturar").hidden = false;
            document.getElementById("btn-cerrar-camara").hidden = false;
            document.getElementById("btn-camara").hidden = true;
          })
          .catch(function () {
            alert("No se pudo abrir la cámara. Permita el acceso en el navegador.");
          });
      }

      function setFacing(facing) {
        cameraFacing = facing;
        document.getElementById("btn-camara-trasera").className = facing === "environment" ? "is-on" : "";
        document.getElementById("btn-camara-frontal").className = facing === "user" ? "is-on" : "";
        if (cameraStream) openCamera();
      }

      document.getElementById("btn-camara").addEventListener("click", openCamera);
      document.getElementById("btn-cerrar-camara").addEventListener("click", stopCamera);
      document.getElementById("btn-camara-trasera").addEventListener("click", function () { setFacing("environment"); });
      document.getElementById("btn-camara-frontal").addEventListener("click", function () { setFacing("user"); });

      document.getElementById("btn-capturar").addEventListener("click", function () {
        var video = document.getElementById("camera-preview");
        var canvas = document.getElementById("camera-canvas");
        var width = video.videoWidth || 640;
        var height = video.videoHeight || 480;
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(video, 0, 0, width, height);
        canvas.toBlob(function (blob) {
          if (!blob) {
            alert("No se pudo guardar la foto.");
            return;
          }
          var position = null;
          var done = function () {
            blobToBase64(blob).then(function (encoded) {
              photoPayload = { kind: "image", filename: "camara.jpg", content_base64: encoded };
              if (position) {
                photoPayload.latitude = position.coords.latitude;
                photoPayload.longitude = position.coords.longitude;
                document.getElementById("photo-status").textContent = "Foto lista, con la ubicación de este aparato.";
              } else {
                document.getElementById("photo-status").textContent = "Foto lista. Sin ubicación del aparato: el lugar quedará para revisión.";
              }
              var preview = document.getElementById("photo-preview");
              preview.hidden = false;
              preview.src = URL.createObjectURL(blob);
              stopCamera();
            }).catch(function (error) { alert(error.message); });
          };
          if (!navigator.geolocation) {
            done();
            return;
          }
          navigator.geolocation.getCurrentPosition(
            function (pos) { position = pos; done(); },
            function () { done(); },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 10000 }
          );
        }, "image/jpeg", 0.85);
      });

      document.getElementById("btn-microfono").addEventListener("click", function () {
        if (recorder && recorder.state === "recording") {
          recorder.stop();
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("Este navegador no permite usar el micrófono.");
          return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          recordChunks = [];
          recorder = new MediaRecorder(stream);
          recorder.ondataavailable = function (event) {
            if (event.data && event.data.size) recordChunks.push(event.data);
          };
          recorder.onstop = function () {
            var blob = new Blob(recordChunks, { type: recorder.mimeType || "audio/webm" });
            stream.getTracks().forEach(function (track) { track.stop(); });
            blobToBase64(blob).then(function (encoded) {
              audioPayload = { kind: "audio", filename: "nota.webm", content_base64: encoded };
              document.getElementById("audio-status").textContent = "Nota de voz lista.";
              document.getElementById("btn-microfono").textContent = "Grabar nota";
            }).catch(function (error) { alert(error.message); });
          };
          recorder.start();
          document.getElementById("btn-microfono").textContent = "Detener grabación";
          document.getElementById("audio-status").textContent = "Grabando…";
        }).catch(function () {
          alert("No se pudo abrir el micrófono. Permita el acceso en el navegador.");
        });
      });

      document.getElementById("btn-enviar").addEventListener("click", function () {
        var texts = document.getElementById("reports-input").value.split("\n").map(function (line) {
          return line.trim();
        }).filter(function (line) { return line.length > 0; });
        var media = [];
        if (photoPayload) media.push(photoPayload);
        if (audioPayload) media.push(audioPayload);
        if (!texts.length && !media.length) {
          alert("Escriba un reporte, tome una foto o grabe una nota.");
          return;
        }
        postJson("/api/reports", { texts: texts, media: media }).then(function () {
          photoPayload = null;
          audioPayload = null;
          document.getElementById("reports-input").value = "";
          document.getElementById("photo-status").textContent = "";
          document.getElementById("audio-status").textContent = "";
          document.getElementById("photo-preview").hidden = true;
          document.getElementById("send-status").textContent = "Su reporte fue recibido. Una persona del equipo lo revisará.";
        }).catch(function (error) {
          if (String(error.message).indexOf("plan already exists") !== -1) {
            document.getElementById("send-status").textContent = "En este prototipo se acepta un lote de reportes a la vez. El anterior todavía está en revisión.";
            return;
          }
          alert(error.message);
        });
      });

      fetch("/api/context").then(function (res) { return res.json(); }).then(function (data) {
        drawMap(data.sectors || []);
      }).catch(function () { /* mapa vacío si el servicio no responde */ });
    })();
  </script>
</body>
</html>
